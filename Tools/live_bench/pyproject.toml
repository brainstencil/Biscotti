[project]
name = "live-bench"
version = "0.1.0"
description = "Fixtures and scoring for the live transcript replay harness (live-bench)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jiwer==4.0.0",
    "meeteval==0.4.3",
    "numpy==2.5.4",
    "soundfile==0.14.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

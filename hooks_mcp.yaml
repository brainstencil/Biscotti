server_name: "Biscotti"
server_description: "Biscotti dev commands — thin wrappers over the Makefile."

actions:
  - name: "bootstrap"
    description: "Install dev tools via Homebrew (brew bundle)"
    command: "make bootstrap"

  - name: "generate"
    description: "Generate the Xcode project from project.yml"
    command: "make generate"

  # build/test/precommit_checks compile against the argmax-oss-swift dependency
  # (WhisperKit/SpeakerKit), whose build/error output is extremely verbose — an
  # unbounded MCP response can overflow an agent's context window. Bound the
  # response with `tail` (generous, to preserve trailing error detail) while
  # `set -o pipefail` keeps make's exit code so failures still surface as errors.
  # Humans and CI invoke `make` directly and are unaffected.
  - name: "build"
    description: "Build all SPM packages"
    command: "bash -c 'set -o pipefail; make build 2>&1 | tail -n 400'"
    timeout: 300

  - name: "test"
    description: "Gating: run the package test suite (swift test)"
    command: "bash -c 'set -o pipefail; make test 2>&1 | tail -n 400'"
    # Full cross-package suite (including LocalLLM's XCFramework fetch) exceeds
    # the default timeout; 300s matches build/build_llm/test_llm.
    timeout: 300

  - name: "lint"
    description: "Check formatting + lint (non-mutating)"
    command: "make lint"

  - name: "format"
    description: "Auto-format and autofix lint"
    command: "make format"

  - name: "precommit_checks"
    description: "Run the pre-commit checks (format + lint + test). Required before a --no-verify commit from inside the Claude Code agent; see CLAUDE.md."
    command: "bash -c 'set -o pipefail; make precommit-checks 2>&1 | tail -n 400'"

  # build_app/test_app wrap xcodebuild, which is very verbose. The Makefile uses
  # `xcodebuild -quiet` (warnings/errors + final status only); here we additionally
  # tail the result so an MCP tool response stays bounded. `pipefail` keeps make's
  # exit code so failures still surface as errors.
  - name: "build_app"
    description: "Non-gating: generate project + build the app (xcodebuild)"
    command: "bash -c 'set -o pipefail; make build-app 2>&1 | tail -n 30'"

  - name: "test_app"
    description: "Non-gating: run the app test scheme"
    command: "bash -c 'set -o pipefail; make test-app 2>&1 | tail -n 30'"

  - name: "manual_tests_check"
    description: "Check that all manual test step IDs have been run (expected RED until Phase 4.5)"
    command: "bash -c 'set -o pipefail; make manual-tests-check 2>&1 | tail -n 50'"

  # LocalLLM is now part of PACKAGES and included in `make build`/`make test`,
  # but these standalone actions are kept for quick iteration on just the LLM
  # package. Output is tailed to stay within the agent context window (the first
  # build downloads the verbose LlamaSwift XCFramework); `pipefail` preserves the
  # exit code so failures still surface as errors.
  - name: "bench"
    description: "Non-gating: FTS5 search benchmarks (SLOW ~12 min; prints report to stdout)"
    command: "bash -c 'set -o pipefail; make bench 2>&1 | tail -n 400'"
    timeout: 900

  # The live transcript replay harness. ARGS is the live-bench subcommand and
  # its options; the three folders come from the server's environment. A
  # 45-minute soak with its baseline takes about 48 minutes, and a cold
  # release build adds several more, so the limit is two hours.
  - name: "bench_live"
    description: "Non-gating: live transcript replay harness (live-bench). ARGS e.g. \"run --option whisper-current --interval 2 --mode two-track --clips smoke --vocabulary-off\" or \"cost --model NAME\"; \"speech-assets --install\" once before the first speechanalyzer run. Needs BENCH_LIVE_MODELS, BENCH_LIVE_FIXTURES and BENCH_LIVE_OUT in the server environment."
    command: "bash -c 'set -o pipefail; make bench-live 2>&1 | tail -n 400'"
    parameters:
      - name: "ARGS"
        type: "insecure_string"
        description: "live-bench subcommand and options, without --models, --fixtures or --out"
      - name: "BENCH_LIVE_MODELS"
        type: "optional_env_var"
        description: "Model cache folder (holds argmaxinc/whisperkit-coreml/<model>)"
      - name: "BENCH_LIVE_FIXTURES"
        type: "optional_env_var"
        description: "Fixtures folder from Tools/live_bench/make_fixtures.py"
      - name: "BENCH_LIVE_OUT"
        type: "optional_env_var"
        description: "Folder that receives the results"
    timeout: 7200

  - name: "build_llm"
    description: "Build the LocalLLM SPM package (Packages/LocalLLM)"
    command: "bash -c 'set -o pipefail; swift build --package-path Packages/LocalLLM 2>&1 | tail -n 400'"
    timeout: 300

  - name: "test_llm"
    description: "Run the LocalLLM unit tests (Packages/LocalLLM). Always-on tests only; the env-gated AI/integration tests (BISCOTTI_RUN_AI_TESTS=1) need the model and are human-run."
    command: "bash -c 'set -o pipefail; swift test --package-path Packages/LocalLLM 2>&1 | tail -n 400'"
    timeout: 300
